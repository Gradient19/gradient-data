name: Public repository disclosure gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-roster:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Reject unintended tracked files, credentials and manifest drift
        run: python tools/check_public_roster.py
