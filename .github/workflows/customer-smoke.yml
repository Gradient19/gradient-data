name: Customer release smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Public Gradient Data release tag containing the fixed 0.3.0-rc.4 assets
        required: true
        default: v0.3.0-rc.4
        type: string

permissions:
  contents: read

jobs:
  customer-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify published customer bundle on the native runner
        shell: bash
        env:
          GRADIENT_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: python tools/customer_smoke.py --release-tag "$GRADIENT_RELEASE_TAG"
